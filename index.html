function playStampChime(isAllCorrect) {
  try {
    if (!window.Tone) return;
    Tone.start().then(() => {
      const s = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.01, decay: 0.25, sustain: 0.1, release: 0.4 }
      }).toDestination();
      s.volume.value = -8;
      const now = Tone.now();
      if (isAllCorrect) {
        s.triggerAttackRelease('C5', '16n', now);
        s.triggerAttackRelease('E5', '16n', now + 0.09);
        s.triggerAttackRelease('G5', '16n', now + 0.18);
        s.triggerAttackRelease('C6', '8n',  now + 0.27);
      } else {
        s.triggerAttackRelease('G4', '16n', now);
        s.triggerAttackRelease('C5', '8n',  now + 0.12);
      }
      setTimeout(() => s.dispose(), 1200);
    }).catch(() => {});
  } catch (e) {}
}

/* ==================== 1. 調性、音域與記譜拼字系統 ==================== */
const KEYS = [
  {id:'CM', name:'C 大調', md:'M', tonicMidi:60, tl:0, sig:'C'},
  {id:'GM', name:'G 大調', md:'M', tonicMidi:67, tl:4, sig:'G'},
  {id:'DM', name:'D 大調', md:'M', tonicMidi:62, tl:1, sig:'D'},
  {id:'AM', name:'A 大調', md:'M', tonicMidi:57, tl:5, sig:'A'},
  {id:'EM', name:'E 大調', md:'M', tonicMidi:64, tl:2, sig:'E'},
  {id:'FM', name:'F 大調', md:'M', tonicMidi:65, tl:3, sig:'F'},
  {id:'BbM',name:'B♭ 大調',md:'M', tonicMidi:58, tl:6, sig:'Bb'},
  {id:'EbM',name:'E♭ 大調',md:'M', tonicMidi:63, tl:2, sig:'Eb'},
  {id:'AbM',name:'A♭ 大調',md:'M', tonicMidi:56, tl:5, sig:'Ab'},
  {id:'am', name:'a 小調', md:'m', tonicMidi:57, tl:5, sig:'Am'},
  {id:'em', name:'e 小調', md:'m', tonicMidi:64, tl:2, sig:'Em'},
  {id:'bm', name:'b 小調', md:'m', tonicMidi:59, tl:6, sig:'Bm'},
  {id:'f#m',name:'f♯ 小調',md:'m', tonicMidi:66, tl:3, sig:'F#m'},
  {id:'dm', name:'d 小調', md:'m', tonicMidi:62, tl:1, sig:'Dm'},
  {id:'gm', name:'g 小調', md:'m', tonicMidi:67, tl:4, sig:'Gm'},
  {id:'cm', name:'c 小調', md:'m', tonicMidi:60, tl:0, sig:'Cm'},
  {id:'fm', name:'f 小調', md:'m', tonicMidi:65, tl:3, sig:'Fm'}
];

const SCALES = {
  M: [0, 2, 4, 5, 7, 9, 11],
  m: [0, 2, 3, 5, 7, 8, 10]
};
const LETTERS = 'cdefgab';
const LETTER_SEMI = [0, 2, 4, 5, 7, 9, 11];

const CLEF_RANGE = {
  treble: { minMidi: 57, maxMidi: 84, label: '高音譜號（A3–C6）' },
  bass:   { minMidi: 36, maxMidi: 64, label: '低音譜號（C2–E4）' }
};

const CLEF_INSTS = {
  treble: [
    { id: 'flute',  name: '長笛（Flute）', short: '長笛' },
    { id: 'violin', name: '小提琴（Violin）', short: '小提琴' },
    { id: 'piano',  name: '鋼琴（Piano）', short: '鋼琴' }
  ],
  bass: [
    { id: 'cello',         name: '大提琴（Cello）', short: '大提琴' },
    { id: 'bass_clarinet', name: '低音單簧管（Bass Clarinet）', short: '低音單簧管' },
    { id: 'piano',         name: '鋼琴（Piano）', short: '鋼琴' }
  ]
};

function getBaseTonicMidi(key, clef) {
  let bt = key.tonicMidi;
  if (clef === 'bass') {
    while (bt > 51) bt -= 12;
    while (bt < 40) bt += 12;
  } else {
    while (bt < 60) bt += 12;
    while (bt > 71) bt -= 12;
  }
  return bt;
}

function getMidi(key, clef, step, alt = 0) {
  const bt = getBaseTonicMidi(key, clef);
  const octShift = Math.floor(step / 7);
  const deg = mod7(step);
  return bt + 12 * octShift + SCALES[key.md][deg] + alt;
}

function spellNote(key, clef, step, alt = 0) {
  const m = getMidi(key, clef, step, alt);
  const totalStep = key.tl + step;
  const li = mod7(totalStep);
  const oct = Math.round((m - LETTER_SEMI[li]) / 12) - 1;
  const acc = m - (12 * (oct + 1) + LETTER_SEMI[li]);
  const accStr = ['bb', 'b', '', '#', '##'][acc + 2] || '';
  const dispAcc = ['𝄫', '♭', '', '♯', '𝄪'][acc + 2] || '';
  return {
    vfKey: `${LETTERS[li]}${accStr}/${oct}`,
    accStr,
    accVal: acc,
    dispName: `${LETTERS[li].toUpperCase()}${dispAcc}${oct}`,
    midi: m
  };
}

function inClefRange(key, clef, step, alt = 0) {
  const m = getMidi(key, clef, step, alt);
  const r = CLEF_RANGE[clef];
  if (m < r.minMidi || m > r.maxMidi) return false;
  const sp = spellNote(key, clef, step, alt);
  return Math.abs(sp.accVal) <= 1;
}

/* ==================== 2. 雙難度和聲規劃（基礎練習 vs 進階練習） ==================== */
const HCH = {
  M: {
    I:[0,0,'M','I'], ii:[1,0,'m','ii'], iii:[2,0,'m','iii'], IV:[3,0,'M','IV'], V:[4,0,'M','V'], V7:[4,0,'7','V⁷'],
    vi:[5,0,'m','vi'], viio:[6,0,'dim','vii°'],
    iv:[3,0,'m','iv（平行借用）'], bVI:[5,-1,'M','♭VI（平行借用）'], bVII:[6,-1,'M','♭VII（平行借用）'],
    'V/V':[1,0,'7','V⁷/V'], 'V/IV':[0,0,'7','V⁷/IV'], 'V/vi':[2,0,'7','V⁷/vi'], 'V/ii':[5,0,'7','V⁷/ii'],
    N6:[1,-1,'M','N⁶'], c64:[0,0,'M','I⁶₄']
  },
  m: {
    i:[0,0,'m','i'], iio:[1,0,'dim','ii°'], III:[2,0,'M','III'], iv:[3,0,'m','iv'], V:[4,0,'M','V'], V7:[4,0,'7','V⁷'],
    VI:[5,0,'M','♭VI'], VII:[6,0,'M','♭VII'], viio:[6,1,'dim','vii°'],
    IV:[3,0,'M','IV（平行借用♮6）'],
    'V/iv':[0,0,'7','V⁷/iv'], 'V/V':[1,0,'7','V⁷/V'], 'V/III':[6,0,'7','V⁷/III'],
    N6:[1,-1,'M','N⁶'], c64:[0,0,'m','i⁶₄']
  }
};

const HGR_D1 = {
  M: {
    I:['ii','IV','V','V7','vi','iii','viio','V/IV','V/vi','V/ii','V/V','iv','bVI','bVII'],
    ii:['V','V7','viio','c64','V/V'],
    iii:['vi','IV','ii','V/vi','V/ii'],
    IV:['V','V7','ii','I','iv','viio','V/V','c64'],
    V:['I','vi','V7','bVI'],
    V7:['I','vi','bVI'],
    vi:['ii','IV','V','V7','iii','V/V','V/ii','bVI'],
    viio:['I','vi'],
    iv:['V','V7','I','viio','c64'],
    bVI:['iv','V','V7','bVII'],
    bVII:['I','IV','iv','V'],
    'V/V':['V','V7','c64'], 'V/IV':['IV','iv'], 'V/vi':['vi','bVI'], 'V/ii':['ii'],
    c64:['V','V7']
  },
  m: {
    i:['iio','iv','V','V7','VI','III','VII','viio','V/iv','V/III','V/V','IV'],
    iio:['V','V7','viio','c64'],
    III:['VI','iv','iio','VII','V/iv'],
    iv:['V','V7','i','viio','iio','c64','V/V'],
    V:['i','VI','V7'],
    V7:['i','VI'],
    VI:['iio','iv','V','V7','III','VII','V/V','V/III'],
    VII:['III','VI','i','iv'],
    viio:['i'],
    IV:['iv','V','V7','iio'],
    'V/iv':['iv'], 'V/V':['V','V7','c64'], 'V/III':['III'],
    c64:['V','V7']
  }
};

const HGR_D2 = {
  M: {
    I:['ii','IV','V','V7','vi','iii','viio','c64','V/IV','V/vi','V/ii','iv','bVI','bVII','N6'],
    ii:['V','V7','viio','c64','N6'],
    iii:['vi','IV','ii','V/vi'],
    IV:['V','V7','ii','I','iv','viio','V/V','c64','N6'],
    V:['I','vi','V7','bVI'],
    V7:['I','vi','bVI'],
    vi:['ii','IV','V','V7','iii','V/V','V/ii'],
    viio:['I','vi'],
    iv:['V','V7','I','viio','N6','AUG6','c64'],
    bVI:['iv','V','V7','bVII','AUG6','N6'],
    bVII:['I','IV','iv','V'],
    'V/V':['V','V7','c64'], 'V/IV':['IV'], 'V/vi':['vi'], 'V/ii':['ii'],
    c64:['V','V7'], N6:['V','V7','c64'], AUG6:['V','V7','c64']
  },
  m: {
    i:['iio','iv','V','V7','VI','III','VII','viio','c64','V/iv','V/III','IV','N6'],
    iio:['V','V7','viio','c64','N6'],
    III:['VI','iv','iio','VII','V/iv'],
    iv:['V','V7','i','viio','iio','N6','AUG6','c64','V/V'],
    V:['i','VI','V7'],
    V7:['i','VI'],
    VI:['iio','iv','V','V7','III','VII','AUG6','N6','V/V','V/III'],
    VII:['III','VI','i','iv'],
    viio:['i'],
    IV:['iv','V','V7','iio','AUG6','N6'],
    'V/iv':['iv'], 'V/V':['V','V7','c64'], 'V/III':['III'],
    c64:['V','V7'], N6:['V','V7','c64'], AUG6:['V','V7','c64']
  }
};

const HDIA = { M: ['I','ii','iii','IV','V','vi','viio'], m: ['i','iio','III','iv','V','VI','VII'] };

function localKeyName(key, td, ta, lm) {
  const li = mod7(key.tl + td);
  const pc = ((key.tonicMidi % 12) + SCALES[key.md][td] + ta + 120) % 12;
  let acc = ((pc - LETTER_SEMI[li]) % 12 + 12) % 12;
  if (acc > 6) acc -= 12;
  const as = acc === -1 ? '♭' : acc === 1 ? '♯' : '';
  const L = LETTERS[li];
  return lm === 'M' ? `${L.toUpperCase()}${as} 大調` : `${L}${as} 小調`;
}

function makeChord(md, L, name, aug) {
  const hs = SCALES[md], ls = SCALES[L.lm];
  const tonicPc = hs[L.td] + L.ta;
  const toTone = (k, alt) => {
    const d = mod7(L.td + k);
    let a = ((tonicPc + ls[k] + alt - hs[d]) % 12 + 12) % 12;
    if (a > 6) a -= 12;
    return { d, a };
  };
  const scale = ls.map(x => ((tonicPc + x) % 12 + 12) % 12);
  if (L.lm === 'm') scale.push(((tonicPc + 11) % 12 + 12) % 12);
  const pref = L.home ? '' : `${L.short}：`;
  if (name === 'AUG6') {
    const lo = L.lm === 'M' ? -1 : 0;
    const t = [toTone(5, lo), toTone(0, 0)];
    if (aug === 'Fr+6') t.push(toTone(1, 0));
    if (aug === 'Ger+6') t.push(toTone(2, lo));
    t.push(toTone(3, 1));
    return { name, tones: t, label: pref + aug.replace('+6', '⁺⁶'), scale, dom: false, lead: null, sev: null, tag: `增六和弦 ${aug}` };
  }
  const sp = HCH[L.lm][name];
  const rootPc = tonicPc + ls[sp[0]] + sp[1];
  const rootD = mod7(L.td + sp[0]);
  const pat = { M:[0,4,7], m:[0,3,7], dim:[0,3,6], '7':[0,4,7,10] }[sp[2]];
  const tones = pat.map((iv, i) => {
    const d = mod7(rootD + 2 * i);
    let a = ((rootPc + iv - hs[d]) % 12 + 12) % 12;
    if (a > 6) a -= 12;
    return { d, a };
  });
  const dom = ['V','V7','V/V','V/IV','V/vi','V/ii','V/iv','V/III','viio'].includes(name);
  let tag = '';
  if (name === 'N6') tag = '拿波里 N⁶（♭2→7）';
  else if (name.startsWith('V/')) tag = `副屬和弦 ${sp[3]}`;
  else if ((L.lm === 'M' && ['iv','bVI','bVII'].includes(name)) || (L.lm === 'm' && name === 'IV')) tag = `平行調借用 ${sp[3]}`;
  return { name, tones, label: pref + sp[3], scale, dom, lead: name === 'viio' ? tones[0] : (dom ? tones[1] : null), sev: sp[2] === '7' ? tones[3] : null, tag };
}

function chordSig(md, L, name) {
  const sp = HCH[L.lm][name];
  return ((SCALES[md][L.td] + L.ta + SCALES[L.lm][sp[0]] + sp[1]) % 12 + 12) % 12 + '|' + sp[2];
}

function findPivots(md, home, X) {
  const out = [];
  for (const h of HDIA[home.lm]) for (const x of HDIA[X.lm]) {
    if (chordSig(md, home, h) === chordSig(md, X, x)) out.push({ h, x });
  }
  return out;
}

function fillSeg(G, len, anch) {
  const ok = (a, b) => a === b || (G[a] && G[a].includes(b));
  const out = new Array(len).fill(null);
  Object.keys(anch).forEach(k => { out[+k] = anch[k]; });
  let guard = 0;
  function rec(i) {
    if (++guard > 9000) return false;
    if (i === len) return true;
    if (anch[i] !== undefined) return (i === 0 || ok(out[i - 1], out[i])) && rec(i + 1);
    const prev = out[i - 1];
    const opts = [...(G[prev] || [])].sort(() => Math.random() - 0.5);
    if (Math.random() < 0.58) opts.unshift(prev); else opts.push(prev);
    for (const c of opts) {
      out[i] = c;
      if (anch[i + 1] !== undefined && !ok(c, anch[i + 1])) continue;
      if (rec(i + 1)) return true;
    }
    out[i] = null;
    return false;
  }
  return rec(0) ? out : null;
}

function buildHarmonyPlan(key, cfg, diff) {
  const md = key.md, nb = cfg.ticksPerBar / cfg.beatSize, hb = Math.ceil(nb / 2), NB = 8 * nb;
  const home = { td: 0, ta: 0, lm: md, home: true, short: key.name.replace(' ', ''), name: key.name };
  const tonicH = md === 'M' ? 'I' : 'i';
  const circ = ['①', '②', '③', '④'];
  const formType = pick(['sentence', 'asymmetric', 'arch']);

  const tail = off => {
    const o = {};
    for (let b = 6 * nb + hb; b < 7 * nb; b++) o[b - off] = 'V7';
    for (let b = 7 * nb; b < NB; b++) o[b - off] = tonicH;
    return o;
  };

  if (diff === '1') {
    const G1 = HGR_D1[md];
    const secDoms = md === 'M' ? ['V/V', 'V/ii', 'V/vi', 'V/IV'] : ['V/iv', 'V/V', 'V/III'];
    const borrows = md === 'M' ? ['iv', 'bVI', 'bVII'] : ['IV'];

    for (let attempt = 0; attempt < 180; attempt++) {
      const sd = pick(secDoms);
      const sdTarget = sd.split('/')[1];
      const br = pick(borrows);
      const sdBeat = pick([2 * nb, 2 * nb + hb, 3 * nb]);
      const brBeat = pick([4 * nb + hb, 5 * nb, 5 * nb + hb]);

      const anch = {
        0: tonicH,
        [sdBeat]: sd,
        [sdBeat + 1]: sdTarget,
        [brBeat]: br,
        ...tail(0)
      };

      const seq = fillSeg(G1, NB, anch);
      if (!seq) continue;

      const rolesByForm = {
        sentence: [
          '原型動機（Basic Idea）｜建立主調',
          '動機延展與功能進行',
          `動機模進（Sequence）：引入附屬和弦 ${HCH[md][sd][3]}`,
          `模進解決至 ${HCH[md][sdTarget][3]}，跨小節推進不中斷`,
          '展開推進（Continuation）：邁向最高點',
          `平行調借用 ${HCH[md][br][3]}，豐富色彩`,
          '屬七和弦（V⁷）預備終止',
          '完全正格終止（PAC）回到主調'
        ],
        asymmetric: [
          '三小節樂句起首：動機呈示',
          '動機推展',
          `附屬和弦 ${HCH[md][sd][3]} → ${HCH[md][sdTarget][3]} 暫時離調`,
          '新樂句銜接（不作半終止停頓）',
          `最高點樂段：平行調借用 ${HCH[md][br][3]}`,
          '借用和弦向屬功能收斂',
          '屬七和弦（V⁷）導向終止',
          '完全正格終止（PAC）回到主調'
        ],
        arch: [
          '拱形起首（2+3+3 結構）：主調呈示',
          '線條上揚鋪陳',
          `中段推進：附屬和弦 ${HCH[md][sd][3]}`,
          `解決至 ${HCH[md][sdTarget][3]} 並持續推升`,
          '全曲最高點（Climax）',
          `平行調借用 ${HCH[md][br][3]} 柔化線條`,
          '屬七和弦（V⁷）終止準備',
          '完全正格終止（PAC）回到主調'
        ]
      };

      const plan = [];
      for (let b = 0; b < 8; b++) {
        const slots = seq.slice(b * nb, (b + 1) * nb).map(nm => makeChord(md, home, nm, ''));
        const parts = [];
        slots.forEach((c, i) => {
          const last = parts[parts.length - 1];
          if (last && last.c === c.label) last.n.push(i + 1);
          else parts.push({ c: c.label, n: [i + 1] });
        });
        const tags = [...new Set(slots.map(c => c.tag).filter(Boolean))];
        plan.push({
          bar: b + 1,
          slots,
          label: parts.map(pt => `${pt.c} ${pt.n.map(x => circ[x - 1] || x).join('')}`).join(' → '),
          role: rolesByForm[formType][b],
          chrTag: tags.join('；')
        });
      }
      plan.formType = formType;
      plan.modInfo = `基礎練習：全曲維持 ${key.name}（前後同調，不轉調），運用附屬和弦（${HCH[md][sd][3]}）與平行調借用（${HCH[md][br][3]}）`;
      return plan;
    }
  }

  const aBeat = nb >= 3 ? 3 * nb + nb - 2 : 3 * nb;
  const vBeat = 4 * nb - 1;

  for (let attempt = 0; attempt < 180; attempt++) {
    const aug = pick(['It+6', 'Fr+6', 'Ger+6']);
    const useV2 = md === 'M' && Math.random() < 0.45;
    const tg = md === 'M'
      ? (useV2 ? [{td:4,ta:0,lm:'M'}, {td:5,ta:0,lm:'m'}, {td:2,ta:0,lm:'m'}]
               : [{td:4,ta:0,lm:'M'}, {td:5,ta:0,lm:'m'}, {td:3,ta:0,lm:'M'}, {td:2,ta:0,lm:'m'}])
      : [{td:2,ta:0,lm:'M'}, {td:4,ta:0,lm:'m'}, {td:3,ta:0,lm:'m'}, {td:6,ta:0,lm:'M'}, {td:5,ta:0,lm:'M'}];
    const X0 = pick(tg);
    const xname = localKeyName(key, X0.td, X0.ta, X0.lm);
    const X = { ...X0, home: false, name: xname, short: xname.replace(' ', '') };
    const tonicX = X.lm === 'M' ? 'I' : 'i';
    const piv = findPivots(md, home, X).sort(() => Math.random() - 0.5);
    if (!piv.length) continue;

    const mk = (L, nm) => makeChord(md, L, nm, aug);
    const pivChord = (hn, xn, fwd) => {
      const c = makeChord(md, home, hn, aug);
      c.label = fwd ? `${c.label}＝${X.short}：${HCH[X.lm][xn][3]}` : `${X.short}：${HCH[X.lm][xn][3]}＝${c.label}`;
      c.tag = `樞紐和弦 ${c.label}`;
      c.pivot = true;
      return c;
    };

    const beats = [];
    let info, roles;

    if (!useV2) {
      const p = 2 * nb - 1, q = 4 * nb + hb;
      const pf = piv[0];
      const pb = piv[Math.min(piv.length - 1, 1 + Math.floor(Math.random() * (piv.length - 1)))] || piv[0];
      const A = fillSeg(HGR_D2[md], p + 1, { 0: tonicH, [p]: pf.h });
      const B = fillSeg(HGR_D2[X.lm], q - p + 1, { 0: pf.x, [aBeat - p]: 'AUG6', [vBeat - p]: 'V', [4 * nb - p]: tonicX, [q - p]: pb.x });
      const C = fillSeg(HGR_D2[md], NB - q, Object.assign({ 0: pb.h, [5 * nb - q]: 'IV', [5 * nb + hb - q]: 'iv', [6 * nb - q]: 'N6' }, tail(q)));
      if (!A || !B || !C) continue;

      for (let b = 0; b < p; b++) beats.push(mk(home, A[b]));
      beats.push(pivChord(pf.h, pf.x, true));
      for (let b = p + 1; b < q; b++) beats.push(mk(X, B[b - p]));
      beats.push(pivChord(pb.h, pb.x, false));
      for (let b = q + 1; b < NB; b++) beats.push(mk(home, C[b - q]));

      info = `進階練習：${key.name} → 轉調至 ${X.name}（第 3–5 小節，樞紐 ${beats[p].label}）→ 第 5 小節後半以 ${beats[q].label} 轉回原調 ${key.name}`;
      roles = [
        '原型動機（Motif A）｜確立原調',
        '動機延伸；末拍以樞紐和弦轉調',
        `動機模進（Sequence）：進入 ${X.name}`,
        `${X.name}：增六和弦（${aug}）→ 屬和弦跨小節推進`,
        `${X.name} 主和弦解決；後半樞紐回原調（最高點區）`,
        '回原調：借用 IV→iv 預備拿波里（最高點區）',
        '拿波里 N⁶ → V⁷（♭2 減三度下行解決）',
        `完全正格終止（PAC）回到原調 ${key.name}`
      ];
    } else {
      const q2 = 6 * nb - 1;
      const xv = HDIA[X.lm].find(x => chordSig(md, X, x) === chordSig(md, home, 'V'));
      const bk = piv.filter(v => HGR_D2[md][v.h].includes('N6'));
      if (!xv || !bk.length) continue;
      const pb = bk[0];

      const A = fillSeg(HGR_D2[md], vBeat + 1, { 0: tonicH, [2 * nb]: 'IV', [2 * nb + hb]: 'iv', [aBeat]: 'AUG6', [vBeat]: 'V' });
      const B = fillSeg(HGR_D2[X.lm], q2 - vBeat + 1, { 0: xv, [nb]: 'V', [nb + 1]: tonicX, [q2 - vBeat]: pb.x });
      const C = fillSeg(HGR_D2[md], NB - q2, Object.assign({ 0: pb.h, [6 * nb - q2]: 'N6' }, tail(q2)));
      if (!A || !B || !C) continue;

      for (let b = 0; b < vBeat; b++) beats.push(mk(home, A[b]));
      const vc = makeChord(md, home, 'V', aug);
      vc.label = `V＝${X.short}：${HCH[X.lm][xv][3]}`;
      vc.tag = `樞紐和弦 ${vc.label}`;
      vc.pivot = true;
      beats.push(vc);
      for (let b = vBeat + 1; b < q2; b++) beats.push(mk(X, B[b - vBeat]));
      beats.push(pivChord(pb.h, pb.x, false));
      for (let b = q2 + 1; b < NB; b++) beats.push(mk(home, C[b - q2]));

      info = `進階練習：${key.name} → 第 4 小節末以 V＝${X.short}：${HCH[X.lm][xv][3]} 轉調至 ${X.name}（第 5–6 小節）→ 第 6 小節末以 ${beats[q2].label} 轉回原調 ${key.name}`;
      roles = [
        '原型動機（Motif A）｜確立原調',
        '動機延伸、功能進行',
        '動機模進（Sequence）：借用 IV→iv 預備增六',
        `增六和弦（${aug}）→ V 兼作新調樞紐，跨小節轉調`,
        `臨時轉調 ${X.name}：新調功能推進（最高點區）`,
        `${X.name} 屬→主確立；末拍樞紐回原調`,
        '拿波里 N⁶ → V⁷（♭2 減三度下行解決）',
        `完全正格終止（PAC）回到原調 ${key.name}`
      ];
    }

    const plan = [];
    for (let b = 0; b < 8; b++) {
      const slots = beats.slice(b * nb, (b + 1) * nb);
      const parts = [];
      slots.forEach((c, i) => {
        const last = parts[parts.length - 1];
        if (last && last.c === c.label) last.n.push(i + 1);
        else parts.push({ c: c.label, n: [i + 1] });
      });
      const tags = [...new Set(slots.map(c => c.tag).filter(Boolean))];
      const inX = slots.filter(c => c.label.includes('：') && !c.pivot).length;
      if (inX) tags.unshift(`臨時轉調 ${X.name}`);
      plan.push({
        bar: b + 1,
        slots,
        label: parts.map(pt => `${pt.c} ${pt.n.map(x => circ[x - 1] || x).join('')}`).join(' → '),
        role: roles[b],
        chrTag: tags.join('；')
      });
    }
    plan.formType = formType;
    plan.modInfo = info;
    return plan;
  }
  return null;
}

/* ==================== 3. 節奏骨架生成（含標準切分音型） ==================== */
const TIME_CONFIG = {
  '4/4': { numBeats: 4, beatValue: 4, ticksPerBar: 16, beatSize: 4, beamGroups: [1, 4] },
  '3/4': { numBeats: 3, beatValue: 4, ticksPerBar: 12, beatSize: 4, beamGroups: [1, 4] },
  '6/8': { numBeats: 6, beatValue: 8, ticksPerBar: 12, beatSize: 6, beamGroups: [3, 8] },
  '9/8': { numBeats: 9, beatValue: 8, ticksPerBar: 18, beatSize: 6, beamGroups: [3, 8] }
};

function buildOneRhythmBar(cfg, allow16) {
  let barTicks = [];
  let bar16Beats = 0;

  if (cfg.beatSize === 4) {
    if (cfg.ticksPerBar === 16 && Math.random() < 0.22) {
      return pick([
        [4, 8, 4],
        [2, 4, 4, 4, 2]
      ]);
    }
    let rem = cfg.ticksPerBar;
    while (rem > 0) {
      if (rem >= 8 && Math.random() < 0.42) {
        barTicks.push(...pick([[2, 4, 2], [2, 6], [6, 2], [4, 4]]));
        rem -= 8;
      } else {
        const simpleCells = [[4], [2, 2], [4]];
        const sixteenthCells = [[1, 2, 1], [2, 1, 1], [1, 1, 2], [3, 1], [1, 1, 1, 1]];
        if (allow16 && bar16Beats < 2 && Math.random() < 0.46) {
          barTicks.push(...pick(sixteenthCells));
          bar16Beats++;
        } else {
          barTicks.push(...pick(simpleCells));
        }
        rem -= 4;
      }
    }
  } else {
    const nb = cfg.numBeats / 3;
    for (let cb = 0; cb < nb; cb++) {
      const compLong = [[6], [4, 2], [2, 4], [2, 2, 2]];
      const comp16 = [[1, 2, 1, 2], [2, 1, 2, 1], [1, 4, 1], [3, 1, 2], [2, 1, 1, 2]];
      if (allow16 && bar16Beats < 1 && Math.random() < 0.46) {
        barTicks.push(...pick(comp16));
        bar16Beats++;
      } else {
        barTicks.push(...pick(compLong));
      }
    }
  }
  return barTicks;
}

function generateRhythm(timeSig, formType) {
  const cfg = TIME_CONFIG[timeSig];
  for (let attempt = 0; attempt < 260; attempt++) {
    const bars = [];
    let consec16 = 0;

    const motifBar = buildOneRhythmBar(cfg, false);
    const seq16Bar = buildOneRhythmBar(cfg, true);

    for (let b = 0; b < 8; b++) {
      let barTicks = [];
      const allow16 = consec16 < 2 && (b >= 1 && b <= 6);

      if (b === 0) {
        barTicks = [...motifBar];
      } else if (b === 2) {
        barTicks = [...motifBar];
      } else if (b === 3) {
        barTicks = buildOneRhythmBar(cfg, Math.random() < 0.35);
      } else if (b === 4 && seq16Bar.includes(1) && Math.random() < 0.65) {
        barTicks = [...seq16Bar];
      } else if (b === 5 && bars[4] && bars[4].includes(1) && Math.random() < 0.55) {
        barTicks = [...bars[4]];
      } else if (b === 7) {
        if (cfg.beatSize === 4) {
          barTicks = cfg.numBeats === 4 ? [4, 4, 8] : [4, 8];
        } else {
          barTicks = cfg.numBeats === 6 ? [6, 6] : [6, 6, 6];
        }
      } else {
        barTicks = buildOneRhythmBar(cfg, allow16);
      }

      const has16 = barTicks.includes(1);
      consec16 = has16 ? consec16 + 1 : 0;
      bars.push(barTicks);
    }

    const groups = [];
    let tickCursor = 0;
    for (let b = 0; b < 8; b++) {
      for (const dur of bars[b]) {
        groups.push({
          groupId: groups.length,
          bar: b,
          startTick: tickCursor,
          ticks: dur,
          isTieSuspension: false
        });
        tickCursor += dur;
      }
    }

    const tieTargets = formType === 'asymmetric' ? [3, 5] : [1, 4];
    let tiesMade = 0;
    for (const targetBar of tieTargets) {
      const barStartTick = targetBar * cfg.ticksPerBar;
      const idx = groups.findIndex(g => g.startTick === barStartTick);
      if (idx > 0 && groups[idx - 1].ticks <= 4 && groups[idx].ticks <= 4 && Math.random() < 0.72) {
        groups[idx - 1].ticks += groups[idx].ticks;
        groups[idx - 1].isTieSuspension = true;
        groups.splice(idx, 1);
        groups.forEach((g, k) => g.groupId = k);
        tiesMade++;
      }
    }
    if (tiesMade === 0) {
      const cand = groups.findIndex(g => g.bar === 1 && g.ticks === 2 && groups[g.groupId + 1]?.ticks === 2);
      if (cand > 0) {
        groups[cand].ticks += groups[cand + 1].ticks;
        groups[cand].isTieSuspension = true;
        groups.splice(cand + 1, 1);
        groups.forEach((g, k) => g.groupId = k);
      }
    }

    const totalTicks = 8 * cfg.ticksPerBar;
    const longTicks = groups.filter(g => g.ticks >= 4).reduce((s, g) => s + g.ticks, 0);
    const any16 = groups.some(g => g.ticks === 1);
    if (longTicks / totalTicks >= 0.42 && any16 && groups.length >= 21 && groups.length <= 42) {
      return groups;
    }
  }
  return null;
}

/* ==================== 4. 反覆與防環繞檢核工具 ==================== */
function analyzePitchRepetitions(midis) {
  let directTriplePlaces = 0;
  let maxSameRun = 1;
  let curRun = 1;
  for (let i = 1; i < midis.length; i++) {
    if (midis[i] === midis[i - 1]) {
      curRun++;
      if (curRun === 3) directTriplePlaces++;
      if (curRun > maxSameRun) maxSameRun = curRun;
    } else {
      curRun = 1;
    }
  }

  let twoNoteOscPlaces = 0;
  let hasFiveOsc = false;
  let neighborTurns = 0;
  for (let i = 2; i < midis.length; i++) {
    if (midis[i] !== midis[i - 1] && midis[i] === midis[i - 2]) {
      neighborTurns++;
      if (i >= 3 && midis[i - 1] === midis[i - 3]) {
        twoNoteOscPlaces++;
        if (i >= 4 && midis[i - 2] === midis[i - 4]) hasFiveOsc = true;
      }
    }
  }

  let stagnantWindows = 0;
  for (let i = 0; i <= midis.length - 6; i++) {
    const win = midis.slice(i, i + 6);
    const uniq = new Set(win).size;
    if (uniq < 4) stagnantWindows++;
    const counts = {};
    for (const m of win.slice(0, 5)) {
      counts[m] = (counts[m] || 0) + 1;
      if (counts[m] >= 3) stagnantWindows++;
    }
  }

  return { directTriplePlaces, maxSameRun, twoNoteOscPlaces, hasFiveOsc, neighborTurns, stagnantWindows };
}

function analyzeContour(midis) {
  let tightTurns = 0, runs = 0, moves = 0, runLen = 0, lastSg = 0, lastAbs = 0;
  for (let i = 1; i < midis.length; i++) {
    const d = midis[i] - midis[i - 1], sg = Math.sign(d), ab = Math.abs(d);
    if (sg === 0) { lastSg = 0; continue; }
    if (sg === lastSg) {
      runLen++;
    } else {
      if (lastSg !== 0) {
        if (ab <= 2 && lastAbs <= 2 && runLen < 2) tightTurns++;
        runs++; moves += runLen;
      }
      runLen = 1;
    }
    lastSg = sg; lastAbs = ab;
  }
  if (lastSg !== 0) { runs++; moves += runLen; }
  return { tightTurns, avgRun: runs ? moves / runs : 0 };
}

function assignDynamics(notes, cfg) {
  const maxMidi = Math.max(...notes.map(n => n.midi));
  const climaxIdx = Math.max(1, notes.findIndex(n => n.midi === maxMidi));
  notes.forEach((n, i) => {
    const off = n.startTick - n.bar * cfg.ticksPerBar;
    let v = (off % cfg.beatSize === 0) ? 0.70 : 0.58;
    if (off === 0) v += 0.04;
    const arc = i <= climaxIdx ? i / climaxIdx : 1 - (i - climaxIdx) / Math.max(1, notes.length - climaxIdx);
    v += 0.13 * arc;
    n.accent = false; n.resolve = false; n.durMul = 1;
    const dissonant = ['App', 'S', 'ChrP'].includes(n.nctType);
    const strongOrLong = (off % cfg.beatSize === 0) || n.ticks >= 4;
    if (((dissonant && n.nctType !== 'ChrP') || (n.alt !== 0 && strongOrLong)) && Math.random() < 0.7) {
      n.accent = true;
      v += 0.18;
    }
    n.vel = v;
  });
  for (let i = 1; i < notes.length; i++) {
    if (notes[i - 1].accent) {
      notes[i].resolve = true;
      notes[i].vel -= 0.16;
      notes[i].durMul = 0.88;
    }
  }
  notes.forEach(n => { n.vel = Math.min(1, Math.max(0.32, n.vel)); });
}

/* ==================== 5. 旋律、動機模仿進行、強制解決外音與歌唱性引擎 ==================== */
function composeMelody(key, clef, timeSig, diff) {
  const cfg = TIME_CONFIG[timeSig];
  const r = CLEF_RANGE[clef];

  for (let outerTry = 0; outerTry < 220; outerTry++) {
    const harmony = buildHarmonyPlan(key, cfg, diff);
    if (!harmony) continue;
    const groups = generateRhythm(timeSig, harmony.formType);
    if (!groups) continue;

    const startDeg = pick([0, 2, 4]);
    let startStep = startDeg;
    if (!inClefRange(key, clef, startStep, 0)) startStep += 7;

    const allSteps = [];
    for (let s = -14; s <= 18; s++) {
      if (inClefRange(key, clef, s, 0)) allSteps.push(s);
    }

    const climaxTargetMidi = Math.min(r.maxMidi - 1, getBaseTonicMidi(key, clef) + (key.md === 'M' ? 16 : 15));
    const startMidiPlan = getMidi(key, clef, startStep, 0);
    const baseTonic = getBaseTonicMidi(key, clef);

    const sh = pick([[0, 2, 4, 6], [0, 3, 2, 5], [0, -2, 2, 5], [0, 2, 5, 4]]);
    const arcPts = [
      startMidiPlan + sh[0],
      startMidiPlan + sh[1],
      startMidiPlan + sh[2],
      startMidiPlan + sh[3],
      climaxTargetMidi - 1,
      climaxTargetMidi,
      climaxTargetMidi - 5,
      baseTonic + 2,
      baseTonic
    ];

    const slotHarms = groups.map(g => {
      const off = g.startTick - g.bar * cfg.ticksPerBar;
      const bi = Math.min(harmony[g.bar].slots.length - 1, Math.floor(off / cfg.beatSize));
      return harmony[g.bar].slots[bi];
    });

    const notes = [];
    let nodesVisited = 0;

    function solve(i, tripleSameSoFar, neighborTurnsSoFar) {
      if (++nodesVisited > 4500) return false;
      if (i === groups.length) {
        const last = notes[notes.length - 1];
        if (last.nctType !== null) return false;
        return true;
      }

      const g = groups[i];
      const barStart = g.bar * cfg.ticksPerBar;
      const offsetInBar = g.startTick - barStart;
      const isStrongBeat = (offsetInBar % cfg.beatSize === 0);
      const isMeasureHead = (offsetInBar === 0);
      const harm = slotHarms[i];
      const nextHarm = i + 1 < groups.length ? slotHarms[i + 1] : harm;
      const isLastNote = (i === groups.length - 1);

      if (i === 0) {
        const sp = spellNote(key, clef, startStep, 0);
        notes.push({
          ...g, step: startStep, alt: 0, midi: sp.midi,
          vfKey: sp.vfKey, dispName: sp.dispName,
          nctType: null, nctDesc: '和聲音（主題動機起音）'
        });
        if (solve(1, 0, 0)) return true;
        notes.pop();
        return false;
      }

      const prev = notes[i - 1];
      const prev2 = i >= 2 ? notes[i - 2] : null;
      const prev3 = i >= 3 ? notes[i - 3] : null;
      const prevLeap = prev2 ? (prev.midi - prev2.midi) : 0;
      const prevStepDiff = prev2 ? (prev.step - prev2.step) : 0;
      const prevHarm = slotHarms[i - 1];

      const bar1Notes = notes.filter(n => n.bar === 0);
      const bar3NotesSoFar = notes.filter(n => n.bar === 2);
      let desiredSeqStepDiff = null;
      if (g.bar === 2 && bar3NotesSoFar.length > 0 && bar3NotesSoFar.length < bar1Notes.length) {
        const k = bar3NotesSoFar.length;
        desiredSeqStepDiff = bar1Notes[k].step - bar1Notes[k - 1].step;
      }

      let runDir = 0, runLen = 0;
      for (let k = notes.length - 1; k >= 1; k--) {
        const sg0 = Math.sign(notes[k].midi - notes[k - 1].midi);
        if (sg0 === 0) break;
        if (runDir === 0) { runDir = sg0; runLen = 1; }
        else if (sg0 === runDir) runLen++;
        else break;
      }
      const arcT = arcPts[g.bar] + (arcPts[g.bar + 1] - arcPts[g.bar]) * (offsetInBar / cfg.ticksPerBar);

      const cands = [];
      for (const s of allSteps) {
        const deg = mod7(s);
        const altsToTry = [0];
        harm.tones.forEach(t => { if (t.d === deg && !altsToTry.includes(t.a)) altsToTry.push(t.a); });
        if (key.md === 'm' && deg === 6 && !altsToTry.includes(1)) altsToTry.push(1);
        if (!isStrongBeat && !isLastNote && g.ticks <= 2) {
          if (!altsToTry.includes(1)) altsToTry.push(1);
          if (!altsToTry.includes(-1)) altsToTry.push(-1);
        }

        for (const alt of altsToTry) {
          if (!inClefRange(key, clef, s, alt)) continue;
          const m = getMidi(key, clef, s, alt);
          const diffMidi = m - prev.midi;
          const stepDiff = s - prev.step;
          const isChordTone = harm.tones.some(t => t.d === deg && t.a === alt);

          if (isLastNote && !(deg === 0 && alt === 0)) continue;
          if (g.bar === 7 && isMeasureHead && !isChordTone) continue;

          if (diff === '2' && g.bar === 6 && isMeasureHead && harm.name === 'N6') {
            if (!(deg === 1 && alt === -1)) continue;
          }
          if (prev.bar === 6 && prev.alt === -1 && mod7(prev.step) === 1) {
            if (!(stepDiff === -2 && diffMidi === -3)) continue;
          }

          if (prev.nctType) {
            if (!isChordTone) continue;
            if (prev.nctType === 'P' || prev.nctType === 'ChrP') {
              if (!(Math.abs(stepDiff) === 1 && Math.abs(diffMidi) <= 2 && Math.sign(stepDiff) === Math.sign(prevStepDiff))) continue;
            } else if (prev.nctType === 'N') {
              if (!(prev2 && m === prev2.midi && Math.abs(stepDiff) === 1)) continue;
            } else if (prev.nctType === 'S' || prev.nctType === 'App') {
              if (!(Math.abs(stepDiff) === 1 && Math.abs(diffMidi) <= 2)) continue;
            } else if (prev.nctType === 'Ant') {
              if (diffMidi !== 0) continue;
            }
          }

          let addsTripleSame = 0;
          if (diffMidi === 0) {
            if (prev2 && prev2.midi === m) {
              if (prev3 && prev3.midi === m) continue;
              if (tripleSameSoFar >= 1) continue;
              addsTripleSame = 1;
            }
          }

          let addsNeighborTurn = 0;
          if (prev2 && m !== prev.midi && m === prev2.midi) {
            if (prev3 && prev.midi === prev3.midi) continue;
            if (neighborTurnsSoFar >= 1) continue;
            addsNeighborTurn = 1;
          }

          if (notes.length >= 5) {
            const recent5 = notes.slice(-5).map(n => n.midi);
            if (new Set([...recent5, m]).size < 4) continue;
            if (recent5.slice(-4).filter(x => x === m).length >= 2) continue;
          }

          if (Math.abs(diffMidi) > 9 || Math.abs(diffMidi) === 6 || Math.abs(diffMidi) === 10 || Math.abs(diffMidi) === 11) continue;
          if (Math.abs(stepDiff) === 1 && Math.abs(diffMidi) === 3 && !(prev.bar === 6 && prev.alt === -1)) continue;

          if (g.ticks === 1 || prev.ticks === 1) {
            if (Math.abs(stepDiff) > 2 || Math.abs(diffMidi) > 4) continue;
            if (Math.abs(stepDiff) === 2 && runDir !== 0 && Math.sign(diffMidi) !== runDir) continue;
          }

          if (Math.abs(prevLeap) >= 5) {
            if (!(diffMidi * prevLeap < 0 && Math.abs(stepDiff) === 1 && Math.abs(diffMidi) <= 2)) continue;
          }

          let nctType = null;
          let nctDesc = '';
          let score = Math.random() * 3.8;

          if (isChordTone) {
            nctType = null;
            nctDesc = alt !== 0 ? `變化和聲音（${harm.label}）` : `和聲音（${harm.label}）`;
            if (isStrongBeat) score -= 16;
            if (alt !== 0) score -= 12;
            if (isMeasureHead && harm.tones[0].d === deg && harm.tones[0].a === alt) score -= 4;
            if (prevHarm !== harm) score -= 4;
          } else {
            if (isLastNote) continue;

            if (g.isTieSuspension && diffMidi === 0 && prev.nctType === null) {
              nctType = 'S';
              nctDesc = `掛留音（由 ${prev.dispName} 保留，下一音級進解決）`;
              score -= 13;
            } else if (isStrongBeat && !isMeasureHead && Math.abs(prevStepDiff) >= 2 && Math.abs(diffMidi) <= 7 && prev.nctType === null) {
              nctType = 'App';
              nctDesc = `倚音（強拍張力音，下一音級進解決）`;
              score -= 9;
            } else if (!isStrongBeat && Math.abs(stepDiff) === 1 && Math.abs(diffMidi) <= 2 && prev.nctType === null) {
              if (alt !== 0 && !(key.md === 'm' && deg === 6 && alt === 1)) {
                if (Math.abs(diffMidi) === 1 && runDir !== 0 && Math.sign(diffMidi) === runDir) {
                  nctType = 'ChrP';
                  nctDesc = `半音經過音（半音級進過渡至下一和弦音）`;
                  score += 2;
                } else {
                  continue;
                }
              } else {
                if (prev2 && m === prev2.midi) {
                  nctType = 'N';
                  nctDesc = `鄰音（由 ${prev.dispName} 級進裝飾後返回）`;
                  score += 1;
                } else {
                  nctType = 'P';
                  nctDesc = `經過音（級進連接前後和弦音）`;
                  score -= 9;
                }
              }
            } else if (!isStrongBeat && g.ticks <= 2 && nextHarm !== harm && nextHarm.tones.some(t => t.d === deg && t.a === alt) && Math.abs(diffMidi) <= 2 && prev.nctType === null) {
              nctType = 'Ant';
              nctDesc = `先現音（提前預示下一和弦音）`;
              score -= 5;
            } else {
              continue;
            }
          }

          if (nctType === 'P' || nctType === 'N' || nctType === 'App' || nctType === 'Ant') {
            const pcRel = ((m - key.tonicMidi) % 12 + 12) % 12;
            if (!harm.scale.includes(pcRel)) continue;
          }

          if (Math.abs(stepDiff) === 1) score -= 3.5;
          const sg = Math.sign(diffMidi);
          if (sg !== 0 && runDir !== 0) {
            if (sg === runDir) {
              if (runLen >= 4) score += 7;
              else score -= (Math.abs(diffMidi) <= 2 ? 6.5 : 2.5);
            } else if (runLen < 2 && Math.abs(prevLeap) <= 2 && Math.abs(diffMidi) <= 2) {
              score += 14;
            } else if (runLen >= 3) {
              score -= 3.5;
            }
          }

          if (prevHarm.lead && mod7(prev.step) === prevHarm.lead.d && prev.alt === prevHarm.lead.a) {
            if (stepDiff === 1 && (diffMidi === 1 || diffMidi === 2)) score -= 13;
            else if (diffMidi !== 0) score += 8;
          }
          if (prevHarm.sev && mod7(prev.step) === prevHarm.sev.d && prev.alt === prevHarm.sev.a) {
            if (stepDiff === -1 && (diffMidi === -1 || diffMidi === -2)) score -= 10;
            else score += 6;
          }

          if (desiredSeqStepDiff !== null && desiredSeqStepDiff !== 0) {
            if (stepDiff === desiredSeqStepDiff) score -= 8.5;
            else if (Math.sign(stepDiff) === Math.sign(desiredSeqStepDiff)) score -= 3.5;
          }

          if (diffMidi === 0 && !g.isTieSuspension && prev.nctType !== 'Ant') score += 16;

          score += Math.abs(m - arcT) * ((g.bar === 4 || g.bar === 5) ? 0.65 : 0.45);
          if (!(g.bar === 4 || g.bar === 5) && m >= climaxTargetMidi) score += 28;

          if (Math.abs(diffMidi) === 3 || Math.abs(diffMidi) === 4) score -= 2.5;
          if (Math.abs(diffMidi) >= 7) score += 4.5;

          cands.push({
            step: s, alt, midi: m, nctType, nctDesc, score,
            addsTripleSame, addsNeighborTurn
          });
        }
      }

      if (!cands.length) return false;
      cands.sort((a, b) => a.score - b.score);

      const topCands = cands.slice(0, 4);
      for (const best of topCands) {
        const sp = spellNote(key, clef, best.step, best.alt);
        notes.push({
          ...g,
          step: best.step,
          alt: best.alt,
          midi: best.midi,
          vfKey: sp.vfKey,
          dispName: sp.dispName,
          nctType: best.nctType,
          nctDesc: best.nctDesc
        });

        if (solve(i + 1, tripleSameSoFar + best.addsTripleSame, neighborTurnsSoFar + best.addsNeighborTurn)) {
          return true;
        }
        notes.pop();
      }
      return false;
    }

    if (!solve(0, 0, 0) || notes.length !== groups.length) continue;

    const midis = notes.map(n => n.midi);
    const rep = analyzePitchRepetitions(midis);
    if (rep.directTriplePlaces > 1 || rep.maxSameRun > 3) continue;
    if (rep.twoNoteOscPlaces > 0 || rep.hasFiveOsc) continue;
    if (rep.neighborTurns > 1 || rep.stagnantWindows > 0) continue;

    const maxMidi = Math.max(...midis);
    const minMidi = Math.min(...midis);
    const maxIndices = notes.map((n, idx) => n.midi === maxMidi ? idx : -1).filter(idx => idx !== -1);
    const climaxInMid = maxIndices.length === 1 && (notes[maxIndices[0]].bar === 4 || notes[maxIndices[0]].bar === 5);
    const nctCount = notes.filter(n => n.nctType !== null).length;

    let stepIntervals = 0;
    for (let k = 1; k < midis.length; k++) {
      const iv = Math.abs(midis[k] - midis[k - 1]);
      if (iv === 1 || iv === 2) stepIntervals++;
    }
    const stepRatio = stepIntervals / (midis.length - 1);

    const contour = analyzeContour(midis);
    const strict = outerTry < 140;
    if (contour.tightTurns > (strict ? 3 : 6) || contour.avgRun < (strict ? 1.9 : 1.55)) continue;

    const hasAltered = notes.some(n => n.alt !== 0);
    if (!hasAltered && outerTry < 180) continue;

    if (maxMidi - minMidi >= 10 && climaxInMid && nctCount >= (strict ? 4 : 3) && stepRatio >= 0.45 && stepRatio <= 0.86) {
      assignDynamics(notes, cfg);
      return {
        harmony,
        trueGroups: notes,
        climaxBar: notes[maxIndices[0]].bar + 1,
        climaxNote: notes[maxIndices[0]].dispName
      };
    }
  }
  return null;
}

/* ==================== 6. 譜面故意錯音生成器（保底 3～5 個錯音） ==================== */
function hasTruePitchWithinTwoMainBeats(trueGroups, idx, twoMainBeatsTicks) {
  const target = trueGroups[idx];
  const tStart = target.startTick;
  const tEnd = target.startTick + target.ticks;
  for (let j = 0; j < trueGroups.length; j++) {
    if (j === idx) continue;
    const other = trueGroups[j];
    if (other.midi !== target.midi) continue;
    const oStart = other.startTick;
    const oEnd = other.startTick + other.ticks;
    if (oStart < tEnd + twoMainBeatsTicks && oEnd > tStart - twoMainBeatsTicks) {
      return true;
    }
  }
  return false;
}

function injectScoreErrors(key, clef, timeSig, trueGroups) {
  const errCount = pick([3, 4, 5]);
  const twoMainBeatsTicks = 2 * TIME_CONFIG[timeSig].beatSize;
  const candidates = [];
  for (let i = 1; i < trueGroups.length - 1; i++) {
    if (candidates.length > 0 && candidates[candidates.length - 1] === i - 1 && trueGroups[i].ticks === 1) continue;
    candidates.push(i);
  }

  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  candidates.sort((a, b) => {
    const na = hasTruePitchWithinTwoMainBeats(trueGroups, a, twoMainBeatsTicks) ? 1 : 0;
    const nb = hasTruePitchWithinTwoMainBeats(trueGroups, b, twoMainBeatsTicks) ? 1 : 0;
    return na - nb;
  });

  const wrongSet = new Set();
  let nearbyRefCount = 0;
  const scoreGroups = trueGroups.map(g => ({ ...g }));

  for (let pass = 0; pass < 2 && wrongSet.size < errCount; pass++) {
    for (const idx of candidates) {
      if (wrongSet.size >= errCount) break;
      if (wrongSet.has(idx)) continue;
      const isNearbyRef = hasTruePitchWithinTwoMainBeats(trueGroups, idx, twoMainBeatsTicks);
      if (pass === 0 && isNearbyRef && nearbyRefCount >= 1) continue;

      const orig = trueGroups[idx];
      const traps = [
        { step: orig.step, alt: orig.alt === 0 ? pick([1, -1]) : 0 },
        { step: orig.step + 1, alt: 0 },
        { step: orig.step - 1, alt: 0 },
        { step: orig.step + 2, alt: 0 },
        { step: orig.step - 2, alt: 0 }
      ];
      traps.sort(() => Math.random() - 0.5);

      for (const tr of traps) {
        if (!inClefRange(key, clef, tr.step, tr.alt)) continue;
        const newMidi = getMidi(key, clef, tr.step, tr.alt);
        if (newMidi === orig.midi) continue;
        if (idx > 0 && newMidi === scoreGroups[idx - 1].midi) continue;
        if (idx + 1 < scoreGroups.length && newMidi === scoreGroups[idx + 1].midi) continue;

        if (pass === 0) {
          const testMidis = scoreGroups.map((g, k) => k === idx ? newMidi : g.midi);
          const rep = analyzePitchRepetitions(testMidis);
          if (rep.directTriplePlaces > 1 || rep.maxSameRun > 3) continue;
          if (rep.twoNoteOscPlaces > 0 || rep.hasFiveOsc) continue;
        }

        const sp = spellNote(key, clef, tr.step, tr.alt);
        scoreGroups[idx].step = tr.step;
        scoreGroups[idx].alt = tr.alt;
        scoreGroups[idx].midi = sp.midi;
        scoreGroups[idx].vfKey = sp.vfKey;
        scoreGroups[idx].dispName = sp.dispName;
        wrongSet.add(idx);
        if (isNearbyRef) nearbyRefCount++;
        break;
      }
    }
  }

  return { scoreGroups, wrongGroupIds: wrongSet };
}

/* ==================== 7. 標準切分音視譜拆分解碼器 ==================== */
function splitGroupsToVisualMeasures(groups, timeSig) {
  const cfg = TIME_CONFIG[timeSig];
  const measures = Array.from({ length: 8 }, () => []);
  const ties = [];

  const durMap = {
    1:  { dur: '16', dots: 0 },
    2:  { dur: '8',  dots: 0 },
    3:  { dur: '8',  dots: 1 },
    4:  { dur: 'q',  dots: 0 },
    6:  { dur: 'q',  dots: 1 },
    8:  { dur: 'h',  dots: 0 },
    12: { dur: 'h',  dots: 1 },
    16: { dur: 'w',  dots: 0 }
  };

  const barSlices = Array.from({ length: 8 }, () => []);
  for (const g of groups) {
    let rem = g.ticks;
    let curTick = g.startTick;
    let partIdx = 0;
    while (rem > 0) {
      const barIdx = Math.floor(curTick / cfg.ticksPerBar);
      const tickInBar = curTick % cfg.ticksPerBar;
      const ticksLeftInBar = cfg.ticksPerBar - tickInBar;
      const inBarLen = Math.min(rem, ticksLeftInBar);
      barSlices[barIdx].push({
        groupId: g.groupId,
        vfKey: g.vfKey,
        barIdx,
        tickInBar,
        len: inBarLen,
        isContinuationFromPrevBar: partIdx > 0
      });
      rem -= inBarLen;
      curTick += inBarLen;
      partIdx++;
    }
  }

  const lastVisualIdByGroup = {};
  let visualId = 0;

  for (let m = 0; m < 8; m++) {
    const slices = barSlices[m];
    const sigStr = slices.map(s => s.len).join(',');
    const isWholeBarSymSync = (timeSig === '4/4' && sigStr === '4,8,4');
    const isWholeBarOffbeat = (timeSig === '4/4' && sigStr === '2,4,4,4,2') ||
                              (timeSig === '3/4' && sigStr === '2,4,2');

    for (const sl of slices) {
      let rem = sl.len;
      let pos = sl.tickInBar;

      while (rem > 0) {
        let maxChunk = rem;

        if (cfg.beatSize === 4) {
          const beatRem = 4 - (pos % 4);
          const is16thSyncopation = (pos % 2 !== 0) || (rem % 2 !== 0);
          if (is16thSyncopation && beatRem < 4 && maxChunk > beatRem) {
            maxChunk = beatRem;
          }
          else if (timeSig === '4/4' && pos < 8 && pos + maxChunk > 8) {
            if (!isWholeBarSymSync && !isWholeBarOffbeat) {
              maxChunk = 8 - pos;
            }
          }
          else if (timeSig === '3/4' && pos === 4 && rem === 6 && sigStr === '4,6,2') {
            maxChunk = 4;
          }
        } else {
          const compRem = 6 - (pos % 6);
          if (pos % 6 !== 0 && maxChunk > compRem) {
            maxChunk = compRem;
          }
        }

        const validSizes = Object.keys(durMap).map(Number).filter(x => x <= maxChunk).sort((a, b) => b - a);
        const chunk = validSizes[0];
        const spec = durMap[chunk];

        const vNote = {
          visualId,
          groupId: sl.groupId,
          bar: m,
          vfKey: sl.vfKey,
          dur: spec.dur,
          dots: spec.dots,
          ticks: chunk
        };
        measures[m].push(vNote);

        const prevVid = lastVisualIdByGroup[sl.groupId];
        if (prevVid !== undefined) {
          ties.push({
            fromVid: prevVid,
            toVid: visualId
          });
        }
        lastVisualIdByGroup[sl.groupId] = visualId;
        visualId++;
        rem -= chunk;
        pos += chunk;
      }
    }
  }

  return { measures, ties };
}

/* ==================== 8. 應用程式狀態管理 ==================== */
const STATE = {
  question: null,
  mode: 'error',
  selectedWrong: new Set(),
  graded: false,
  inspectTrue: false,
  revealedDict: false,
  showAnalysis: false,
  playCount: 0,
  transportState: 'stopped',
  lastRenderW: 0
};

function getDiffName(diff) {
  return diff === '1' ? '基礎練習' : '進階練習';
}

function initDropdowns() {
  $('selKey').innerHTML = '<option value="random">隨機調性（大調／小調）</option>' +
    KEYS.map(k => `<option value="${k.id}">${k.name}</option>`).join('');
  updateInstrumentOptions();
}

function updateInstrumentOptions() {
  const clef = $('selClef').value;
  const curVal = $('selInst').value;
  const list = CLEF_INSTS[clef];
  $('selInst').innerHTML = list.map(x => `<option value="${x.id}">${x.name}</option>`).join('');
  if (list.some(x => x.id === curVal)) $('selInst').value = curVal;
}

function checkPendingSettings() {
  if (!STATE.question) return;
  const diff = $('selDiff').value !== STATE.question.diff ||
               $('selClef').value !== STATE.question.clef ||
               $('selTime').value !== STATE.question.timeSig ||
               ($('selKey').value !== 'random' && $('selKey').value !== STATE.question.key.id);
  $('pendingHint').hidden = !diff;
}

function hideStampUI() {
  $('gradeStampBanner').hidden = true;
  $('scoreStampOverlay').hidden = true;
  $('scoreStampOverlay').innerHTML = '';
}

function generateNewQuestion() {
  stopPlayback();
  const diff = $('selDiff').value;
  const clef = $('selClef').value;
  const timeSig = $('selTime').value;
  const keyChoice = $('selKey').value;
  const key = keyChoice === 'random' ? pick(KEYS) : KEYS.find(k => k.id === keyChoice);

  updateInstrumentOptions();
  if (liveChain) buildInstrumentSynth($('selInst').value);

  let composed = null;
  for (let i = 0; i < 40; i++) {
    composed = composeMelody(key, clef, timeSig, diff);
    if (composed) break;
  }
  if (!composed) {
    alert('生成題目時發生忙碌，請再按一次「生成新題目」。');
    return;
  }

  const { scoreGroups, wrongGroupIds } = injectScoreErrors(key, clef, timeSig, composed.trueGroups);

  STATE.question = {
    diff,
    key,
    clef,
    timeSig,
    harmony: composed.harmony,
    trueGroups: composed.trueGroups,
    scoreGroups,
    wrongGroupIds,
    climaxBar: composed.climaxBar,
    climaxNote: composed.climaxNote
  };
  STATE.selectedWrong.clear();
  STATE.graded = false;
  STATE.inspectTrue = false;
  STATE.revealedDict = false;
  STATE.showAnalysis = false;
  STATE.playCount = 0;

  $('chkShowAnalysis').checked = false;
  $('pendingHint').hidden = true;
  $('curMeta').textContent = `🎵 目前題目：${getDiffName(diff)}｜${key.name}｜${timeSig} 拍｜${CLEF_RANGE[clef].label}`;
  $('playCounter').textContent = `🎧 已播放次數：0 次`;
  $('gradeSummary').textContent = '';
  $('btnToggleInspect').hidden = true;
  hideStampUI();

  syncModeUI();
  renderScore();
  renderAnalysis();
}

/* ==================== 9. VexFlow 自適應繪譜與精準 Hitbox 互動 ==================== */
function renderScore() {
  const q = STATE.question;
  if (!q) return;

  const { Renderer, Stave, StaveNote, GhostNote, Voice, Formatter, Beam, StaveTie, Accidental, Dot, Fraction } = Vex.Flow;
  const endBarType = Vex.Flow.BarlineType ? Vex.Flow.BarlineType.END : Vex.Flow.Barline.type.END;
  const host = $('score');
  host.innerHTML = '';
  const ov = $('ov');
  ov.innerHTML = '';

  const paperEl = $('paperBox');
  const availW = Math.max(540, Math.floor((paperEl ? paperEl.clientWidth : 1120) - 6));
  STATE.lastRenderW = availW;

  const barsPerLine = availW < 860 ? 2 : 4;
  const numSystems = 8 / barsPerLine;
  const canvasW = availW;
  const rowGap = 194;
  const canvasH = numSystems * rowGap + 50;

  const wrap = $('wrap');
  wrap.style.width = `${canvasW}px`;
  wrap.style.height = `${canvasH}px`;

  const marginL = 12;
  const marginR = 14;
  const usableW = canvasW - marginL - marginR;
  const firstColExtra = 64;
  const baseColW = Math.floor((usableW - firstColExtra) / barsPerLine);

  const sysX = [];
  const sysW = [];
  let cursorX = marginL;
  for (let c = 0; c < barsPerLine; c++) {
    const w = baseColW + (c === 0 ? firstColExtra : 0);
    sysX.push(cursorX);
    sysW.push(w);
    cursorX += w;
  }

  const renderer = new Renderer(host, Renderer.Backends.SVG);
  renderer.resize(canvasW, canvasH);
  const ctx = renderer.getContext();

  const useTrue = (STATE.mode === 'analysis') ||
                  (STATE.mode === 'dictation' && STATE.revealedDict) ||
                  (STATE.mode === 'error' && STATE.graded && STATE.inspectTrue);

  const activeGroups = useTrue ? q.trueGroups : q.scoreGroups;
  const { measures, ties } = splitGroupsToVisualMeasures(activeGroups, q.timeSig);
  const cfg = TIME_CONFIG[q.timeSig];
  const safeDiatonicKey = q.trueGroups[0]?.vfKey || 'c/4';

  const visualStaveNotes = {};

  const isNoteVisibleInDictation = vn => {
    if (vn.bar === 0) return true;
    const origGroup = q.trueGroups[vn.groupId];
    return origGroup && origGroup.bar === 0;
  };

  for (let m = 0; m < 8; m++) {
    const sys = Math.floor(m / barsPerLine);
    const col = m % barsPerLine;
    const y = 46 + sys * rowGap;
    const stave = new Stave(sysX[col], y, sysW[col]);

    if (col === 0) {
      stave.addClef(q.clef).addKeySignature(q.key.sig);
      if (m === 0) stave.addTimeSignature(q.timeSig);
    }
    if (m === 7) stave.setEndBarType(endBarType);
    stave.setContext(ctx).draw();

    const barTag = document.createElement('div');
    barTag.className = 'bar-tag' + (m % 2 === 1 ? ' alt' : '');
    barTag.textContent = `m.${m + 1}`;
    barTag.style.left = `${sysX[col] + (col === 0 ? 6 : 2)}px`;
    barTag.style.top = `${y - 22}px`;
    barTag.style.transform = `rotate(${m % 2 === 0 ? -2.2 : 1.8}deg)`;
    ov.appendChild(barTag);

    const mNotes = measures[m];
    const vfNotes = mNotes.map(vn => {
      if (STATE.mode === 'dictation' && !STATE.revealedDict && !isNoteVisibleInDictation(vn)) {
        const gn = new GhostNote({ duration: vn.dur, dots: vn.dots });
        gn.keys = [safeDiatonicKey];
        return gn;
      }
      const sn = new StaveNote({
        keys: [vn.vfKey],
        duration: vn.dur,
        dots: vn.dots,
        clef: q.clef,
        auto_stem: true
      });
      for (let d = 0; d < vn.dots; d++) Dot.buildAndAttach([sn], { all: true });

      if (STATE.mode === 'error' && STATE.graded && !STATE.inspectTrue) {
        const isActualWrong = q.wrongGroupIds.has(vn.groupId);
        const isUserSel = STATE.selectedWrong.has(vn.groupId);
        if (isActualWrong && isUserSel) {
          sn.setStyle({ fillStyle: '#247a48', strokeStyle: '#247a48' });
        } else if (isActualWrong && !isUserSel) {
          sn.setStyle({ fillStyle: '#d93829', strokeStyle: '#d93829' });
        } else if (!isActualWrong && isUserSel) {
          sn.setStyle({ fillStyle: '#d47a17', strokeStyle: '#d47a17' });
        }
      }

      visualStaveNotes[vn.visualId] = { staveNote: sn, groupId: vn.groupId, bar: m };
      return sn;
    });

    const voice = new Voice({ num_beats: cfg.numBeats, beat_value: cfg.beatValue }).setStrict(false);
    voice.addTickables(vfNotes);

    const visibleNotes = vfNotes.filter(n => !(n instanceof GhostNote));
    if (visibleNotes.length > 0) {
      Accidental.applyAccidentals([voice], q.key.sig);
    }

    const beamGroups = [new Fraction(cfg.beamGroups[0], cfg.beamGroups[1])];
    const beams = visibleNotes.length > 0
      ? Beam.generateBeams(visibleNotes, { groups: beamGroups })
      : [];

    const padW = col === 0 ? (m === 0 ? 118 : 96) : 28;
    new Formatter().joinVoices([voice]).format([voice], Math.max(80, sysW[col] - padW));
    voice.draw(ctx, stave);
    beams.forEach(b => b.setContext(ctx).draw());
  }

  for (const t of ties) {
    const entry1 = visualStaveNotes[t.fromVid];
    const entry2 = visualStaveNotes[t.toVid];
    if (!entry1 || !entry2) continue;
    const n1 = entry1.staveNote;
    const n2 = entry2.staveNote;
    const isCrossLine = Math.floor(entry1.bar / barsPerLine) !== Math.floor(entry2.bar / barsPerLine);
    if (isCrossLine) {
      new StaveTie({ first_note: n1, last_note: null, first_indices: [0], last_indices: [0] }).setContext(ctx).draw();
      new StaveTie({ first_note: null, last_note: n2, first_indices: [0], last_indices: [0] }).setContext(ctx).draw();
    } else {
      new StaveTie({ first_note: n1, last_note: n2, first_indices: [0], last_indices: [0] }).setContext(ctx).draw();
    }
  }

  Object.values(visualStaveNotes).forEach(({ staveNote, groupId }) => {
    const x = staveNote.getNoteHeadBeginX() + 5;
    const y = staveNote.getYs()[0];
    const hit = document.createElement('div');
    hit.className = 'nh-hit';
    hit.dataset.gid = groupId;
    hit.style.left = `${x}px`;
    hit.style.top = `${y}px`;

    if (STATE.mode === 'error') {
      const isUserSel = STATE.selectedWrong.has(groupId);
      const isActualWrong = q.wrongGroupIds.has(groupId);

      if (!STATE.graded) {
        if (isUserSel) hit.classList.add('user-sel');
        hit.onclick = () => {
          if (groupId === 0) return;
          if (STATE.selectedWrong.has(groupId)) STATE.selectedWrong.delete(groupId);
          else STATE.selectedWrong.add(groupId);
          updateSelectionStatus();
          renderScore();
        };
      } else if (!STATE.inspectTrue) {
        if (isActualWrong && isUserSel) hit.classList.add('res-caught');
        else if (isActualWrong && !isUserSel) hit.classList.add('res-missed');
        else if (!isActualWrong && isUserSel) hit.classList.add('res-false');
      }
    }
    ov.appendChild(hit);
  });
}

function updateSelectionStatus() {
  if (STATE.mode === 'error' && !STATE.graded && STATE.question) {
    const total = STATE.question.wrongGroupIds.size;
    $('gradeSummary').textContent = `🖍️ 已標記 ${STATE.selectedWrong.size} 個疑似錯音（本題共有 ${total} 個錯音）`;
  }
}

/* ==================== 10. 樂曲結構與和聲外音解析表 ==================== */
function renderAnalysis() {
  const q = STATE.question;
  if (!q) return;

  $('analysisCard').hidden = !STATE.showAnalysis;
  if (!STATE.showAnalysis) return;

  const formNames = {
    sentence: '2+2+4 樂句型（Sentence，第 3 小節動機模進、跨小節推進）',
    asymmetric: '3+3+2 非對稱推進樂句（破除制式 4+4 停頓）',
    arch: '2+3+3 連續拱形樂句（單向線條推向中後段最高點）'
  };
  const chrTags = [...new Set(q.harmony.flatMap(h => (h.chrTag || '').split('；')).filter(x => x && !x.startsWith('臨時轉調')))];

  $('metaGrid').innerHTML = `
    <div class="meta-item"><b>難度與調性：</b>${getDiffName(q.diff)}｜${q.key.name}（${q.timeSig} 拍）｜${CLEF_RANGE[q.clef].label}</div>
    <div class="meta-item"><b>樂句與動機：</b>${formNames[q.harmony.formType] || ''}；唯一最高點位於 <b>第 ${q.climaxBar} 小節（${q.climaxNote}）</b></div>
    <div class="meta-item"><b>調性佈局（首尾同調）：</b>${q.harmony.modInfo || ''}</div>
    <div class="meta-item"><b>包含特色和弦：</b>${chrTags.join('、') || '調內功能進行'}</div>
  `;

  $('analysisBody').innerHTML = q.harmony.map((h, bIdx) => {
    const barGroups = q.trueGroups.filter(g => g.bar === bIdx);
    const details = barGroups.map(g => {
      if (g.nctType) {
        return `<span class="tag nct">${g.nctType}</span><b>${g.dispName}</b>：${g.nctDesc}${g.accent ? ' ▲加重' : ''}`;
      }
      if (g.alt !== 0) {
        return `<span class="tag chr">變化音</span><b>${g.dispName}</b>：${g.nctDesc}${g.accent ? ' ▲加重' : ''}`;
      }
      return null;
    }).filter(Boolean);

    return `
      <tr>
        <td><b>第 ${bIdx + 1} 小節</b></td>
        <td><b>${h.label}</b></td>
        <td>${h.role}</td>
        <td>${details.length ? details.join('<br>') : '和聲骨幹音級進與小跳進行'}</td>
      </tr>
    `;
  }).join('');
}

/* ==================== 11. Tone.js 擬真樂器合成與即時播放 ==================== */
let liveChain = null;

function disposeChain(chain) {
  if (!chain) return;
  if (chain.synth) chain.synth.dispose();
  if (chain.bodyBoost) chain.bodyBoost.dispose();
  if (chain.filter) chain.filter.dispose();
  if (chain.vibrato) chain.vibrato.dispose();
}

function createInstrumentChain(instId, destination) {
  const vibrato = new Tone.Vibrato({ frequency: 5.2, depth: 0.08 }).connect(destination);
  let filter = null;
  let bodyBoost = null;
  let synth = null;

  if (instId === 'flute') {
    vibrato.depth.value = 0.06;
    filter = new Tone.Filter(3200, 'lowpass').connect(vibrato);
    synth = new Tone.Synth({
      oscillator: { type: 'sine' },
      envelope: { attack: 0.055, decay: 0.15, sustain: 0.85, release: 0.25 }
    }).connect(filter);
    synth.volume.value = -3;
  } else if (instId === 'violin') {
    vibrato.depth.value = 0.11;
    filter = new Tone.Filter(3000, 'lowpass').connect(vibrato);
    synth = new Tone.Synth({
      oscillator: { type: 'fatsawtooth', count: 3, spread: 12 },
      envelope: { attack: 0.06, decay: 0.2, sustain: 0.85, release: 0.3 }
    }).connect(filter);
    synth.volume.value = -7;
  } else if (instId === 'cello') {
    vibrato.depth.value = 0.09;
    filter = new Tone.Filter(3400, 'lowpass').connect(vibrato);
    bodyBoost = new Tone.Filter({ frequency: 850, type: 'peaking', Q: 1.8, gain: 6 }).connect(filter);
    synth = new Tone.Synth({
      oscillator: { type: 'sawtooth' },
      envelope: { attack: 0.035, decay: 0.2, sustain: 0.88, release: 0.3 }
    }).connect(bodyBoost);
    synth.volume.value = 2;
  } else if (instId === 'bass_clarinet') {
    vibrato.depth.value = 0.05;
    filter = new Tone.Filter(2400, 'lowpass').connect(vibrato);
    synth = new Tone.Synth({
      oscillator: { type: 'square' },
      envelope: { attack: 0.035, decay: 0.2, sustain: 0.85, release: 0.25 }
    }).connect(filter);
    synth.volume.value = -2;
  } else {
    vibrato.depth.value = 0;
    filter = new Tone.Filter(3800, 'lowpass').connect(vibrato);
    synth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'triangle' },
      envelope: { attack: 0.008, decay: 0.55, sustain: 0.32, release: 0.75 }
    }).connect(filter);
    synth.volume.value = -1;
  }

  return { synth, vibrato, filter, bodyBoost };
}

function buildInstrumentSynth(instId) {
  disposeChain(liveChain);
  liveChain = createInstrumentChain(instId, Tone.getDestination());
}

async function playTonicCadence() {
  const q = STATE.question;
  if (!q) return;
  stopPlayback();
  await Tone.start();

  const p = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'triangle' },
    envelope: { attack: 0.015, decay: 0.4, sustain: 0.35, release: 0.6 }
  }).toDestination();
  p.volume.value = -4;

  const bt = getBaseTonicMidi(q.key, q.clef);
  const third = q.key.md === 'M' ? 4 : 3;
  const f = m => Tone.Frequency(m, 'midi').toFrequency();
  const now = Tone.now() + 0.04;

  p.triggerAttackRelease([f(bt), f(bt + third), f(bt + 7)], '4n', now);
  p.triggerAttackRelease([f(bt - 1), f(bt + 5), f(bt + 7)], '4n', now + 0.55);
  p.triggerAttackRelease([f(bt), f(bt + third), f(bt + 7), f(bt + 12)], '2n', now + 1.1);
  setTimeout(() => p.dispose(), 2600);
}

function highlightPlayingGroup(gid) {
  document.querySelectorAll('.nh-hit').forEach(el => {
    el.classList.toggle('playing', +el.dataset.gid === gid);
  });
}

function schedulePlayback() {
  const q = STATE.question;
  if (!q) return;
  const T = Tone.Transport;
  T.cancel();

  const bpm = +$('rngBpm').value;
  T.bpm.value = bpm;
  const sixteenthSec = (60 / bpm) / 4;

  for (const g of q.trueGroups) {
    const startSec = g.startTick * sixteenthSec;
    const durSec = Math.max(0.06, g.ticks * sixteenthSec * 0.95);
    const freq = Tone.Frequency(g.midi, 'midi').toFrequency();

    T.schedule(time => {
      if (liveChain && liveChain.synth) {
        liveChain.synth.triggerAttackRelease(freq, durSec * (g.durMul || 1), time, g.vel || 0.75);
      }
      Tone.Draw.schedule(() => highlightPlayingGroup(g.groupId), time);
    }, startSec);
  }

  const totalTicks = 8 * TIME_CONFIG[q.timeSig].ticksPerBar;
  const endSec = totalTicks * sixteenthSec + 0.15;
  T.schedule(time => {
    Tone.Draw.schedule(() => {
      stopPlayback();
    }, time);
  }, endSec);
}

function stopPlayback() {
  if (window.Tone) {
    Tone.Transport.stop();
    Tone.Transport.cancel();
  }
  if (liveChain && liveChain.synth && liveChain.synth.releaseAll) {
    liveChain.synth.releaseAll();
  }
  highlightPlayingGroup(-1);
  STATE.transportState = 'stopped';
}

/* ==================== 12. 事件綁定 ==================== */
function syncModeUI() {
  $('errorControls').hidden = STATE.mode !== 'error';
  $('legendBar').hidden = STATE.mode !== 'error';
  $('dictControls').hidden = STATE.mode !== 'dictation';
  if (STATE.mode !== 'error') {
    $('gradeStampBanner').hidden = true;
    $('scoreStampOverlay').hidden = true;
  } else if (STATE.graded) {
    $('gradeStampBanner').hidden = false;
    $('scoreStampOverlay').hidden = false;
  }
  updateSelectionStatus();
}

$('btnGen').onclick = generateNewQuestion;
$('btnCadence').onclick = playTonicCadence;

$('selDiff').onchange = checkPendingSettings;
$('selClef').onchange = () => {
  updateInstrumentOptions();
  if (liveChain) buildInstrumentSynth($('selInst').value);
  checkPendingSettings();
};
$('selTime').onchange = checkPendingSettings;
$('selKey').onchange = checkPendingSettings;

$('selInst').onchange = () => {
  if (liveChain) buildInstrumentSynth($('selInst').value);
};

$('rngBpm').oninput = e => {
  $('lblBpm').textContent = e.target.value;
  if (window.Tone) Tone.Transport.bpm.value = +e.target.value;
};

$('btnPlay').onclick = async () => {
  await Tone.start();
  if (!liveChain) buildInstrumentSynth($('selInst').value);

  if (STATE.transportState === 'paused') {
    Tone.Transport.start();
    STATE.transportState = 'playing';
  } else {
    Tone.Transport.stop();
    schedulePlayback();
    STATE.playCount += 1;
    $('playCounter').textContent = `🎧 已播放次數：${STATE.playCount} 次`;
    Tone.Transport.start('+0.05');
    STATE.transportState = 'playing';
  }
};

$('btnPause').onclick = () => {
  if (STATE.transportState === 'playing') {
    Tone.Transport.pause();
    if (liveChain && liveChain.synth && liveChain.synth.releaseAll) {
      liveChain.synth.releaseAll();
    }
    STATE.transportState = 'paused';
  }
};

$('btnStop').onclick = stopPlayback;

document.querySelectorAll('input[name="mode"]').forEach(radio => {
  radio.onchange = () => {
    STATE.mode = radio.value;
    syncModeUI();
    renderScore();
  };
});

$('chkShowAnalysis').onchange = e => {
  STATE.showAnalysis = e.target.checked;
  renderAnalysis();
  if (STATE.showAnalysis) {
    $('analysisCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
};

$('btnCloseAnalysis').onclick = () => {
  STATE.showAnalysis = false;
  $('chkShowAnalysis').checked = false;
  renderAnalysis();
};

$('btnRevealDict').onclick = () => {
  STATE.revealedDict = !STATE.revealedDict;
  renderScore();
};

$('btnClearSel').onclick = () => {
  if (STATE.graded) return;
  STATE.selectedWrong.clear();
  updateSelectionStatus();
  renderScore();
};

$('btnGrade').onclick = () => {
  const q = STATE.question;
  if (!q || STATE.graded) return;
  STATE.graded = true;
  STATE.inspectTrue = false;

  let caught = 0;
  let falseAlarm = 0;
  q.wrongGroupIds.forEach(gid => {
    if (STATE.selectedWrong.has(gid)) caught++;
  });
  STATE.selectedWrong.forEach(gid => {
    if (!q.wrongGroupIds.has(gid)) falseAlarm++;
  });
  const totalWrong = q.wrongGroupIds.size;
  const missed = totalWrong - caught;
  const isAllCorrect = (missed === 0 && falseAlarm === 0);

  $('gradeSummary').textContent =
    `抓對 ${caught} / ${totalWrong} 個錯音｜漏抓 ${missed} 個｜誤判 ${falseAlarm} 個`;
  $('btnToggleInspect').hidden = false;
  $('btnToggleInspect').textContent = '切換檢視：目前為「測驗標記譜面」';

  const banner = $('gradeStampBanner');
  banner.hidden = false;
  banner.classList.remove('all-ok', 'has-err');
  banner.classList.add(isAllCorrect ? 'all-ok' : 'has-err');

  if (isAllCorrect) {
    $('stampBannerTitle').textContent = '🎉 恭喜全對！獲得「好寶寶」印章！';
    $('stampBannerDesc').textContent =
      `精準抓出全部 ${totalWrong} 個錯音、零誤判（共播放 ${STATE.playCount} 次），耳朵超靈敏！`;
  } else {
    $('stampBannerTitle').textContent = '💪 蓋上「一起加油」章！再聽一次對照看看吧～';
    $('stampBannerDesc').textContent =
      `本次抓對 ${caught} / ${totalWrong} 個錯音（漏抓 ${missed} 個、誤判 ${falseAlarm} 個｜共播放 ${STATE.playCount} 次），可切換「正確原譜」或開啟解析核對喔！`;
  }

  const stampSvg = buildStampSVG(isAllCorrect, caught, totalWrong);
  $('stampBannerSvg').innerHTML = stampSvg;
  $('stampBannerSvg').style.animation = 'none';
  void $('stampBannerSvg').offsetWidth;
  $('stampBannerSvg').style.animation = '';

  const scoreStamp = $('scoreStampOverlay');
  scoreStamp.innerHTML = stampSvg;
  scoreStamp.hidden = false;
  scoreStamp.style.animation = 'none';
  void scoreStamp.offsetWidth;
  scoreStamp.style.animation = '';

  playStampChime(isAllCorrect);
  renderScore();
};

$('btnToggleInspect').onclick = () => {
  STATE.inspectTrue = !STATE.inspectTrue;
  $('btnToggleInspect').textContent = STATE.inspectTrue
    ? '切換檢視：目前為「正確原譜」'
    : '切換檢視：目前為「測驗標記譜面」';
  renderScore();
};

if (window.ResizeObserver) {
  const ro = new ResizeObserver(() => {
    if (!STATE.question) return;
    const curW = Math.max(540, Math.floor($('paperBox').clientWidth - 6));
    if (Math.abs(curW - STATE.lastRenderW) > 12) {
      renderScore();
    }
  });
  ro.observe($('paperBox'));
}

// 初始化
initDropdowns();
generateNewQuestion();
</script>
</body>
