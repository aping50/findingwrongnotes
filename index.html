<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音樂班高階旋律視唱與聽寫訓練系統（學生版）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js"></script>
<style>
:root{
  --bg:#faf3e6;
  --dot:#dccdb4;
  --fg:#3b3127;
  --card:#fffdf8;
  --ac:#c86432;
  --ac2:#3568b8;
  --bd:#e2d1b7;
  --shadow-lip:#dccab0;
  --muted:#786a59;
  --ok:#247a48;
  --bad:#d93829;
  --warn:#d47a17;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(var(--dot) 1.3px, transparent 1.3px),
    radial-gradient(rgba(224,205,176,.45) 1px, transparent 1px);
  background-size:22px 22px;
  background-position:0 0, 11px 11px;
  color:var(--fg);
  font-family:"Rounded Mplus 1c","Hiragino Maru Gothic ProN","Noto Sans TC","PingFang TC",system-ui,-apple-system,sans-serif;
  margin:0;
  padding:20px 18px 32px;
  line-height:1.55;
  overflow-x:hidden;
}

/* 音樂筆記本卡片基底（方正對齊、統一圓角） */
.sticker-card{
  position:relative;
  background:var(--card);
  border:2px solid var(--bd);
  border-radius:16px;
  box-shadow:
    0 0 0 3px #fffdf8,
    0 4px 0 var(--shadow-lip),
    0 8px 18px rgba(105,78,46,.08);
}

/* 手撕鋸齒邊緣和紙膠帶（斜角貼法） */
.washi{
  position:absolute;
  height:20px;
  width:84px;
  pointer-events:none;
  z-index:4;
  opacity:.88;
  box-shadow:0 2px 3px rgba(85,62,34,.12);
  clip-path:polygon(
    3% 0%, 97% 0%,
    100% 14%, 96% 29%, 100% 45%, 97% 62%, 100% 79%, 96% 100%,
    3% 100%,
    0% 82%, 4% 66%, 0% 48%, 3% 31%, 0% 15%
  );
}
.washi.corner-tl{
  top:-6px;
  left:-16px;
  transform:rotate(-34deg);
  background:repeating-linear-gradient(45deg,rgba(244,172,178,.82),rgba(244,172,178,.82) 6px,rgba(253,222,225,.88) 6px,rgba(253,222,225,.88) 12px);
}
.washi.corner-tr{
  top:-4px;
  right:-14px;
  transform:rotate(31deg);
  background:repeating-linear-gradient(-45deg,rgba(167,215,189,.82),rgba(167,215,189,.82) 6px,rgba(219,243,229,.88) 6px,rgba(219,243,229,.88) 12px);
}
.washi.top-tilt{
  top:-10px;
  left:46%;
  width:92px;
  transform:rotate(-4.5deg);
  background:radial-gradient(rgba(255,255,255,.7) 2.2px, transparent 2.2px), rgba(245,205,121,.84);
  background-size:10px 10px;
}
.washi.gingham{
  top:-8px;
  left:26px;
  width:88px;
  transform:rotate(3.6deg);
  background-color:rgba(218,233,252,.85);
  background-image:
    linear-gradient(90deg, rgba(154,193,242,.55) 50%, transparent 50%),
    linear-gradient(rgba(154,193,242,.55) 50%, transparent 50%);
  background-size:12px 12px;
}
.washi.kraft{
  top:-9px;
  right:42px;
  width:78px;
  transform:rotate(-5.2deg);
  background:repeating-linear-gradient(90deg,rgba(214,180,136,.82),rgba(214,180,136,.82) 4px,rgba(228,198,158,.86) 4px,rgba(228,198,158,.86) 8px);
}

/* 邊角插畫模切小貼紙 */
.doodle-sticker{
  position:absolute;
  pointer-events:none;
  z-index:5;
  filter:drop-shadow(0 2px 2px rgba(90,65,35,.16));
}

header{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:15px 20px;
  margin-bottom:15px;
}
.title-wrap{display:flex;align-items:center;gap:12px}
.title-sticker{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;
  border-radius:13px;
  background:#ffedd5;border:2px solid #f5c38e;
  box-shadow:0 0 0 2.5px #fffdf8, 0 3px 0 #ebd0ad;
  font-size:1.4rem;flex-shrink:0;
}
h1{font-size:1.22rem;margin:0;letter-spacing:.03em;color:#4a3520;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.student-pill{
  display:inline-block;
  font-size:.76rem;
  font-weight:800;
  padding:2px 9px;
  border-radius:999px;
  background:#e6f4ea;
  color:#236b3e;
  border:1.5px solid #9fd1b0;
}
.subtitle{font-size:.83rem;color:var(--muted);margin-top:2px}

.bar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  padding:11px 16px;
  margin-bottom:13px;
}
.group{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap}

/* 貼紙感按鈕 */
button{
  background:var(--ac);
  color:#fff;
  border:2px solid #a84d20;
  border-radius:11px;
  padding:7px 14px;
  font-size:.9rem;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 0 #9e471c;
  transition:transform .08s, filter .15s;
}
button:hover{filter:brightness(1.04);transform:translateY(-1px)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #9e471c}
button:disabled{opacity:.48;cursor:not-allowed;transform:none}

button.secondary{
  background:#fffaf0;
  color:#6b4423;
  border:2px dashed #cbb596;
  border-radius:11px;
  box-shadow:0 3px 0 #e2d3bc;
}
button.secondary:active{box-shadow:0 1px 0 #e2d3bc}

button.primary-blue{
  background:#3b73c4;
  border-color:#295699;
  box-shadow:0 3px 0 #234b87;
}
button.primary-blue:active{box-shadow:0 1px 0 #234b87}

button.cadence-btn{
  background:#8b5cf6;
  border-color:#6d3fd6;
  box-shadow:0 3px 0 #5b32ba;
}
button.cadence-btn:active{box-shadow:0 1px 0 #5b32ba}

button.success{
  background:#2d8a54;
  border-color:#1e663c;
  box-shadow:0 3px 0 #1a5934;
}
button.success:active{box-shadow:0 1px 0 #1a5934}

select,input[type="range"],input[type="checkbox"],input[type="radio"]{accent-color:var(--ac)}
select{
  background:#fffcf5;
  color:var(--fg);
  border:2px solid #decbb0;
  border-radius:10px;
  padding:6px 10px;
  font-size:.88rem;
  font-weight:600;
  cursor:pointer;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.04);
}
label{font-size:.89rem;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-weight:600}

.mode-pill{
  padding:5px 12px;
  border-radius:11px;
  background:#fbf5e8;
  border:1.5px solid #dfd0b8;
  transition:background .15s, border-color .15s;
}
.mode-pill:has(input:checked){
  background:#ffedd5;
  border-color:#e59a54;
  color:#7c3814;
  box-shadow:0 2px 0 #ebd0ad;
}

.toggle-analysis{
  padding:5px 12px;
  border-radius:11px;
  font-weight:700;
  background:#f2f7f1;
  border:2px dashed #9ec4a4;
  color:#27633b;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 13px;
  border-radius:999px;
  font-size:.84rem;
  font-weight:700;
  background:#fff3e0;
  color:#8c471c;
  border:2px solid #f0cba0;
  box-shadow:0 0 0 2px #fffdf8, 0 2px 0 #ebd4b7;
}
.badge.count{
  background:#eef4ff;
  color:#2b5ba8;
  border-color:#bfd4f7;
  box-shadow:0 0 0 2px #fffdf8, 0 2px 0 #cdddf7;
}
.pending-hint{
  font-size:.82rem;
  color:#b45309;
  background:#fef3c7;
  border:1.5px dashed #f59e0b;
  padding:4px 12px;
  border-radius:999px;
  font-weight:700;
}

/* 批閱成績與印章橫幅 */
.stamp-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:12px 18px;
  margin-bottom:13px;
  background:#fffcf4;
  border:2px dashed #d8c3a3;
  border-radius:16px;
  box-shadow:0 4px 12px rgba(105,78,46,.08);
}
.stamp-banner[hidden]{display:none}
.stamp-banner.all-ok{
  background:linear-gradient(135deg,#fff9f7 0%,#fffdf6 100%);
  border-color:#f0a8a0;
}
.stamp-banner.has-err{
  background:linear-gradient(135deg,#f5f9ff 0%,#fffdf6 100%);
  border-color:#a8c5f0;
}
.stamp-info h3{margin:0 0 4px;font-size:1.05rem}
.stamp-banner.all-ok .stamp-info h3{color:#c92a1d}
.stamp-banner.has-err .stamp-info h3{color:#2357a8}
.stamp-info p{margin:0;font-size:.9rem;color:#57493a;font-weight:600}
.stamp-visual-box{
  flex-shrink:0;
  transform:rotate(-7deg);
  animation:stampSlam .42s cubic-bezier(.18,.89,.32,1.28) both;
}

@keyframes stampSlam{
  0%{opacity:0;transform:scale(1.85) rotate(-20deg)}
  65%{opacity:1;transform:scale(.94) rotate(-6deg)}
  100%{opacity:1;transform:scale(1) rotate(-8deg)}
}

/* 五線譜手帳多層拼貼底紙 */
.paper-outer{
  position:relative;
  margin-top:8px;
  margin-bottom:16px;
}
.paper-outer::before{
  content:"";
  position:absolute;
  inset:2px -3px -4px 4px;
  background:#ebd9bd;
  border:1.5px dashed #cbb18b;
  border-radius:16px;
  transform:rotate(-0.5deg);
  z-index:0;
  pointer-events:none;
}
.paper-outer::after{
  content:"";
  position:absolute;
  inset:-2px 4px 2px -3px;
  background:#f6ebd7;
  border:1.5px solid #dfd0b8;
  border-radius:16px;
  transform:rotate(0.4deg);
  z-index:0;
  pointer-events:none;
}
.paper{
  position:relative;
  z-index:1;
  background:#fffef9;
  background-image:linear-gradient(to bottom, rgba(226,214,194,.22) 1px, transparent 1px);
  background-size:100% 24px;
  color:#1f1c18;
  border:2px solid #dfd0b8;
  border-radius:16px;
  overflow-x:auto;
  width:100%;
  box-shadow:0 6px 16px rgba(95,70,42,.1);
}
#wrap{position:relative;user-select:none;margin:0 auto}
#ov{position:absolute;inset:0;pointer-events:none}

/* 手帳小節標籤貼紙 */
.bar-tag{
  position:absolute;
  padding:1px 7px;
  font-size:11px;
  font-weight:800;
  color:#7a5230;
  background:#f7ebd4;
  border:1px solid #dec7a1;
  border-radius:6px 4px 7px 5px;
  box-shadow:0 1px 2px rgba(90,65,35,.12);
  pointer-events:none;
  user-select:none;
}
.bar-tag.alt{
  background:#fce8e4;
  border-color:#ebb8ae;
}

/* 蓋在五線譜右下角的油墨印章 */
#scoreStampOverlay{
  position:absolute;
  right:24px;
  bottom:14px;
  pointer-events:none;
  z-index:4;
  mix-blend-mode:multiply;
  transform:rotate(-10deg);
  animation:stampSlam .45s cubic-bezier(.18,.89,.32,1.28) both;
}
#scoreStampOverlay[hidden]{display:none}

/* 音符點擊感應區與狀態標記 */
.nh-hit{
  position:absolute;width:28px;height:28px;margin-left:-14px;margin-top:-14px;
  border-radius:50%;pointer-events:auto;cursor:pointer;
  transition:background .12s,transform .1s;
}
.nh-hit:hover{background:rgba(53,104,184,.16)}
.nh-hit.playing{
  background:rgba(245,158,11,.38)!important;
  outline:2.5px solid #d97706;
  transform:scale(1.14);
}
.nh-hit.user-sel{
  background:rgba(217,56,41,.16);
  outline:2.5px solid #d93829;
}
.nh-hit.res-caught{
  background:rgba(36,122,72,.18);
  outline:3px solid #247a48;
  border-radius:50%;
}
.nh-hit.res-caught::after{
  content:"✓";position:absolute;top:-17px;left:50%;transform:translateX(-50%);
  background:#247a48;color:#fff;font-size:10px;font-weight:800;
  padding:0 5px;border-radius:6px;line-height:15px;box-shadow:0 1px 2px rgba(0,0,0,.15);
}
.nh-hit.res-missed{
  background:rgba(217,56,41,.16);
  outline:3px solid #d93829;
  border-radius:6px;
}
.nh-hit.res-missed::after{
  content:"漏抓";position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  background:#d93829;color:#fff;font-size:10px;font-weight:800;
  padding:0 5px;border-radius:6px;line-height:15px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.15);
}
.nh-hit.res-false{
  background:rgba(212,122,23,.16);
  outline:2.5px dashed #d47a17;
  border-radius:50%;
}
.nh-hit.res-false::before{
  content:"";position:absolute;left:2px;right:2px;top:50%;height:2.5px;
  background:#d47a17;transform:rotate(-22deg);
}
.nh-hit.res-false::after{
  content:"誤判";position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  background:#d47a17;color:#fff;font-size:10px;font-weight:800;
  padding:0 5px;border-radius:6px;line-height:15px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.15);
}

.legend-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:.86rem}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px}
.dot.sel{border:2.5px solid #d93829;background:rgba(217,56,41,.16)}
.dot.ok{border:2.5px solid #247a48;background:rgba(36,122,72,.18)}
.dot.miss{border:2.5px solid #d93829;border-radius:3px;background:rgba(217,56,41,.16)}
.dot.fal{border:2.5px dashed #d47a17;background:rgba(212,122,23,.16)}

/* 解析筆記卡 */
.analysis-card{
  position:relative;
  padding:16px 18px;
  margin-top:16px;
  font-size:.9rem;
}
.analysis-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;
}
.analysis-card h2{font-size:1.04rem;margin:0;color:#7c441e}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:9px;margin-bottom:12px}
.meta-item{
  background:#fbf5e9;
  border:1.5px dashed #d8c6a8;
  border-radius:12px;
  padding:8px 11px;
}
table{width:100%;border-collapse:collapse;font-size:.87rem;margin-top:6px;background:#fffef9}
th,td{border:1.5px solid #e2d4be;padding:7px 9px;text-align:left;vertical-align:top}
th{background:#f7ecda;font-weight:800;color:#5c3a1d}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:.78rem;font-weight:800;margin-right:5px}
.tag.chr{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.tag.nct{background:#e0e7ff;color:#1e40af;border:1px solid #a5b4fc}
</style>
</head>
<body>

<!-- SVG 橡皮圖章油墨質感濾鏡定義 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="rubber-ink" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<header class="sticker-card">
  <span class="washi corner-tl"></span>
  <span class="washi corner-tr"></span>
  <svg class="doodle-sticker" style="right:14px;bottom:-14px;transform:rotate(12deg)" width="34" height="34" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="15" fill="#fffdf8" stroke="#e4cfa8" stroke-width="2"/>
    <path d="M16 23V11l8-2v12" fill="none" stroke="#c86432" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="13.5" cy="23.5" r="2.8" fill="#c86432"/>
    <circle cx="21.5" cy="21.5" r="2.8" fill="#c86432"/>
  </svg>
  <div class="title-wrap">
    <div class="title-sticker">📒</div>
    <div>
      <h1>音樂班高階旋律視唱與聽寫訓練系統 <span class="student-pill">學生自主練習版</span></h1>
      <div class="subtitle">8 小節歌唱性動機模進旋律（基礎練習：附屬／借用與外音解決｜進階練習：增六／拿波里／轉調回原調）</div>
    </div>
  </div>
  <div class="group">
    <span class="badge" id="curMeta">🎵 目前題目：載入中…</span>
    <span class="badge count" id="playCounter">🎧 已播放次數：0 次</span>
  </div>
</header>

<!-- 第一列：出題設定 -->
<div class="bar sticker-card bar-setup">
  <span class="washi kraft"></span>
  <button id="btnGen">🎲 生成新題目</button>
  <div class="group">
    <label>難度：
      <select id="selDiff">
        <option value="1">基礎練習（調性＋解決外音＋附屬和弦＋平行調借用）</option>
        <option value="2">進階練習（增六和弦＋拿波里和弦＋轉調回原調）</option>
      </select>
    </label>
    <label>譜號：
      <select id="selClef">
        <option value="treble">高音譜號（A3–C6）</option>
        <option value="bass">低音譜號（C2–E4）</option>
      </select>
    </label>
    <label>拍號：
      <select id="selTime">
        <option value="4/4">4/4 拍</option>
        <option value="3/4">3/4 拍</option>
        <option value="6/8">6/8 拍</option>
        <option value="9/8">9/8 拍</option>
      </select>
    </label>
    <label>調性：
      <select id="selKey"></select>
    </label>
  </div>
  <span class="pending-hint" id="pendingHint" hidden>📌 條件已變更，請按「生成新題目」套用</span>
</div>

<!-- 第二列：播放與音色控制（學生版不含音檔匯出） -->
<div class="bar sticker-card bar-audio">
  <div class="group">
    <button id="btnCadence" class="cadence-btn" title="先聽本題調性的主和弦終止式定調">🎹 主和弦定調</button>
    <button id="btnPlay" class="primary-blue">▶ 播放旋律</button>
    <button id="btnPause" class="secondary">⏸ 暫停</button>
    <button id="btnStop" class="secondary">⏹ 停止／從頭</button>
  </div>
  <div class="group">
    <label>樂器音色：
      <select id="selInst"></select>
    </label>
    <label>速度：
      <input type="range" id="rngBpm" min="45" max="105" value="66">
      <b id="lblBpm">66</b> BPM
    </label>
  </div>
  <svg class="doodle-sticker" style="right:-10px;top:-12px;transform:rotate(14deg)" width="30" height="30" viewBox="0 0 32 32">
    <path d="M16 3l3.6 7.8 8.4 1-6.2 5.8 1.6 8.4L16 21.8 8.6 26l1.6-8.4L4 11.8l8.4-1z" fill="#fde68a" stroke="#fffdf8" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
</div>

<!-- 第三列：訓練模式、解析開關與聽音辨誤批閱列 -->
<div class="bar sticker-card bar-mode">
  <div class="group">
    <label class="mode-pill"><input type="radio" name="mode" value="error" checked> <b>聽音辨誤模式</b>（找出譜面錯音）</label>
    <label class="mode-pill"><input type="radio" name="mode" value="dictation"> <b>純聽寫模式</b>（示首小節與連結音）</label>
    <label class="mode-pill"><input type="radio" name="mode" value="analysis"> <b>全樂譜呈現模式</b></label>
  </div>
  <div class="group">
    <label class="toggle-analysis">
      <input type="checkbox" id="chkShowAnalysis"> 📑 顯示樂曲結構、變化和弦與外音解析
    </label>
  </div>
  <div class="group" id="errorControls">
    <button id="btnClearSel" class="secondary">🧹 清除標記</button>
    <button id="btnGrade" class="success">💮 送出批閱蓋章</button>

<script>

const mod7 = x => ((x % 7) + 7) % 7;
